name: Loyalty QR isolated tests
on:
  push:
    branches: [feat/lealtad-qr-clientes]
    paths:
      - 'supabase/migrations/20261103_loyalty_*.sql'
      - 'supabase/tests/loyalty-qr-contract.sql'
      - '.github/workflows/loyalty-qr-isolated-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261103_loyalty_*.sql'
      - 'supabase/tests/loyalty-qr-contract.sql'
      - '.github/workflows/loyalty-qr-isolated-tests.yml'
jobs:
  loyalty-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elegance_loyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elegance_loyalty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: elegance_loyalty_test
    steps:
      - uses: actions/checkout@v4
      - name: Run loyalty registration, deduplication, visit and reward tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/loyalty-qr-contract.sql
