name: Deployed preview smoke
on:
  push:
    branches: [feat/servicios-promociones-web]
    paths:
      - 'web-promotion-package/deployed-preview-smoke.mjs'
      - '.github/workflows/deployed-preview-smoke.yml'
permissions:
  contents: read
jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://elegance-barber-piste-g8njzuafo-dell-723c.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test deployed, mock-only Vercel preview
        run: node web-promotion-package/deployed-preview-smoke.mjs
