<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elegance Barber - POS</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#302817,#080808 42%);padding:20px}.card{width:min(420px,100%);background:#151515;border:1px solid #333;border-radius:18px;padding:26px}.logo{color:#d4af37;text-align:center;font:700 28px Georgia,serif}.sub{text-align:center;color:#777;font-size:11px;letter-spacing:2px;margin:7px 0 22px}.input,.select{width:100%;padding:13px;margin:6px 0;background:#090909;color:#fff;border:1px solid #333;border-radius:9px}.btn{padding:12px 15px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.gold{background:#d4af37;color:#000}.full{width:100%;margin-top:8px}.err{text-align:center;color:#ef4444;font-size:12px;margin-top:10px}.app{display:none}.top{background:#0c0c0c;border-bottom:1px solid #292929;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{color:#d4af37;font:700 22px Georgia,serif}.topBtns{display:flex;gap:8px}.walkBtn{background:#242424;color:#fff;border:1px solid #444}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{background:#121212;border:1px solid #292929;border-radius:15px;padding:16px}.title{font-size:18px;font-weight:700;margin-bottom:12px}.muted{color:#888;font-size:12px}.res{background:#181818;border:1px solid #303030;border-radius:11px;padding:12px;margin:8px 0;cursor:pointer}.res.active{border-color:#d4af37;background:#201e00}.row{display:flex;justify-content:space-between;gap:10px}.badge{font-size:10px;padding:5px 8px;border-radius:15px;background:#292929}.price,.total{color:#d4af37;font-weight:700}.total{font-size:30px;margin:8px 0 15px}.change{margin-top:10px;color:#6ee7a0;font-weight:700}.mixed-fields{display:none}.mixed-fields.active{display:block}.empty{text-align:center;color:#777;padding:25px}.sale{border-bottom:1px solid #292929;padding:10px 0;font-size:12px}.sale button{padding:5px 8px;margin-top:5px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;place-items:center;padding:18px}.modalCard{width:min(430px,100%);background:#151515;border:1px solid #333;border-radius:15px;padding:18px}.modalCard h3{margin:0 0 12px;color:#d4af37}.modalActions{display:flex;gap:8px}.modalActions .btn{flex:1}@media(max-width:750px){.grid{grid-template-columns:1fr}}@media print{@page{size:58mm auto;margin:0}body{background:#fff!important;color:#000!important}body>*{display:none!important}#ticketPrint{display:block!important;width:58mm;padding:3mm;font-family:Arial,sans-serif;font-size:11px;color:#000!important}}</style><meta name="theme-color" content="#0a0a0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Elegance POS"><link rel="manifest" href="/pos.webmanifest"><link rel="apple-touch-icon" href="/icons/elegance-192.png">
</head><body>
<div id="login" class="login"><div class="card"><div class="logo">ELEGANCE BARBER</div><div class="sub">PUNTO DE VENTA · PISTÉ</div><input id="u" class="input" value="EdgarMay" placeholder="Usuario"><input id="p" class="input" type="password" placeholder="Contraseña"><button id="go" class="btn gold full">INGRESAR AL POS</button><div id="err" class="err"></div></div></div>
<div id="app" class="app"><header class="top"><div class="brand">ELEGANCE BARBER POS</div><div class="topBtns"><button id="openWalkin" class="btn walkBtn">+ Venta sin reserva</button><button id="out" class="btn">Salir</button></div></header><main class="wrap"><div class="grid"><section class="panel"><div class="title">Reservas de hoy</div><div class="muted">Selecciona una reserva confirmada o en servicio para cobrar.</div><div id="reservas"><div class="empty">Cargando...</div></div></section><section class="panel"><div class="title">Cobrar servicio</div><div id="selected" class="muted">Selecciona una reserva.</div><div id="total" class="total">$0.00</div><select id="method" class="select"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mixto</option></select><input id="received" class="input" type="number" min="0" step="0.01" placeholder="Efectivo recibido"><div id="mixedFields" class="mixed-fields"><input id="cashPart" class="input" type="number" min="0" step="0.01" placeholder="Importe en efectivo"><input id="cardPart" class="input" type="number" min="0" step="0.01" placeholder="Importe en tarjeta"></div><button id="charge" class="btn gold full">COBRAR Y FINALIZAR</button><div id="change" class="change"></div><div class="title" style="font-size:15px;margin-top:20px">Ventas de hoy</div><div id="sales"></div></section></div></main></div>
<div id="walkinModal" class="modal"><div class="modalCard"><h3>Cliente sin reserva</h3><input id="wname" class="input" placeholder="Nombre del cliente"><select id="wservice" class="select"><option value="1" data-price="160">Corte Clásico — $160</option><option value="2" data-price="180">Corte Desvanecido — $180</option><option value="3" data-price="130">Corte Infantil — $130</option><option value="4" data-price="40">Alineación de Ceja — $40</option><option value="5" data-price="80">Alineación de Barba — $80</option><option value="6" data-price="280">Corte + Masaje — $280</option><option value="7" data-price="250">Corte y Lavado de Cabello — $250</option><option value="8" data-price="400">VIP — $400</option><option value="9" data-price="550">Premium — $550</option></select><select id="wpromotion" class="select"><option value="">Sin promoción</option></select><div id="wpromoSummary" class="muted" style="margin:8px 0">Sin promoción seleccionada.</div><select id="wbarber" class="select"><option value="1">EdgarMay</option><option value="2">Staff 2</option></select><select id="whour" class="select"><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option><option>17:00</option><option>17:30</option><option>18:00</option><option>18:30</option><option>19:00</option><option>19:30</option><option>20:00</option><option>20:30</option></select><select id="wmethod" class="select"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mixto</option></select><input id="wreceived" class="input" type="number" min="0" step="0.01" placeholder="Efectivo recibido"><div id="wmixedFields" class="mixed-fields"><input id="wcashPart" class="input" type="number" min="0" step="0.01" placeholder="Importe en efectivo"><input id="wcardPart" class="input" type="number" min="0" step="0.01" placeholder="Importe en tarjeta"></div><div class="modalActions"><button id="closeWalkin" class="btn">Cancelar</button><button id="walkCharge" class="btn gold">COBRAR Y FINALIZAR</button></div></div></div><div id="ticketPrint"></div>
<script src="/config.js"></script>
<script>
const URL=window.ELEGANCE_SUPABASE_URL||'',KEY=window.ELEGANCE_SUPABASE_ANON_KEY||'';let token='',reservas=[],selected=null,walkinPromotions=[];const $=id=>document.getElementById(id);
async function rpc(name,args){if(!URL||!KEY)throw Error('POS sin configurar: falta el endpoint y la clave del entorno.');if(URL.includes('bvcbticzboknkmtgfkgw.supabase.co'))throw Error('Bloqueado: esta versión aislada no puede usar el backend de producción.');const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});let d;try{d=await r.json()}catch(e){d={message:'Respuesta inválida'}}if(!r.ok)throw Error(d.message||'Error de conexión');return d}
async function login(){try{const d=await rpc('barber_admin_login',{p_username:$('u').value.trim(),p_password:$('p').value});token=d.token;sessionStorage.setItem('pos_token',token);openApp()}catch(e){$('err').textContent=e.message}}$('go').onclick=login;$('p').onkeydown=e=>{if(e.key==='Enter')login()};$('out').onclick=()=>{sessionStorage.removeItem('pos_token');location.reload()};
function render(){const list=reservas.filter(r=>['confirmada','en_servicio'].includes(r.estado));$('reservas').innerHTML=list.length?list.map(r=>'<div class="res '+(selected&&selected.id===r.id?'active':'')+'" onclick="pick(\''+r.id+'\')"><div class="row"><b>'+r.nombre+'</b><span class="badge">'+r.estado.toUpperCase()+'</span></div><div class="muted">🕐 '+r.hora+' · 💈 '+r.barbero+'</div><div class="muted">✂️ '+r.servicio+'</div><div class="row" style="margin-top:6px"><span>Folio #'+r.id+'</span><span class="price">$'+r.precio+'</span></div></div>').join(''):'<div class="empty">No hay reservas listas para cobrar.</div>'}
function pick(id){
 selected=reservas.find(r=>String(r.id)===String(id));
 if(!selected)return;
 const total=Number(selected.precio||0),subtotal=Number(selected.precio_base??total);
 const discount=Math.max(subtotal-total,0);
 $('selected').innerHTML='<b>'+selected.nombre+'</b><br><span class="muted">'+selected.servicio+' · '+selected.barbero+' · '+selected.hora+'</span>'+
   (discount>0?'<div class="muted" style="margin-top:6px">Subtotal $'+subtotal.toFixed(2)+' · Descuento -$'+discount.toFixed(2)+(selected.promotion_title?' · '+selected.promotion_title:'')+'</div>':'');
 $('total').textContent='$'+total.toFixed(2);$('change').textContent='';render()
}
function printTicket(info){
 const total=Number(info.total??info.precio??0);
 const subtotal=Number(info.subtotal??info.precio_base??total);
 const discount=Number(info.descuento??Math.max(subtotal-total,0));
 const promotion=info.promotion_title?'<div><b>PROMOCIÓN:</b> '+info.promotion_title+'</div>':'';
 const breakdown='<div><b>SUBTOTAL:</b> $'+subtotal.toFixed(2)+'</div>'+
   (discount>0?promotion+'<div><b>DESCUENTO:</b> -$'+discount.toFixed(2)+'</div>':'');
 const split=String(info.metodo||'')==='Mixto'?'<div><b>EFECTIVO:</b> $'+Number(info.efectivo||0).toFixed(2)+'</div><div><b>TARJETA:</b> $'+Number(info.tarjeta||0).toFixed(2)+'</div>':'';
 $('ticketPrint').innerHTML='<div style="text-align:center;font-weight:700;font-size:14px">ELEGANCE BARBER</div><div style="text-align:center">PISTÉ, YUCATÁN</div><hr><div><b>FOLIO:</b> '+(info.folio||'')+'</div><div><b>CLIENTE:</b> '+(info.cliente||info.nombre||'')+'</div><div><b>SERVICIO:</b> '+(info.servicio||'')+'</div><div><b>BARBERO:</b> '+(info.barbero||'')+'</div>'+breakdown+'<div><b>MÉTODO:</b> '+(info.metodo||'')+'</div>'+split+'<hr><div style="font-size:15px;font-weight:700;text-align:right">TOTAL $'+total.toFixed(2)+'</div><div style="text-align:center;margin-top:8px">Gracias por tu visita</div>';
 window.print()
}
async function load(){if(!token)return;try{try{const enriched=await rpc('barber_admin_reservations_with_promotions',{p_token:token});reservas=Array.isArray(enriched)?enriched:(await rpc('barber_admin_reservations',{p_token:token})||[])}catch(_){reservas=await rpc('barber_admin_reservations',{p_token:token})||[]}if(selected){selected=reservas.find(r=>r.id===selected.id)||null;if(!selected){$('selected').textContent='Selecciona una reserva.';$('total').textContent='$0.00'}}render();const s=await rpc('barber_admin_sales',{p_token:token});$('sales').innerHTML=(s||[]).map(x=>'<div class="sale"><b>'+x.folio+'</b> · '+x.cliente+' · '+x.servicio+'<br><span class="muted">$'+x.total+' · '+x.metodo+'</span> <button class="btn" onclick="printTicket('+JSON.stringify(x).replace(/"/g,'&quot;')+')">🖨️ 58 mm</button></div>').join('')||'<div class="empty">Sin ventas hoy.</div>'}catch(e){console.error(e)}}
function mixedPaymentArgs(method,cashId,cardId,total){if(method!=='Mixto')return {};const cash=Number($(cashId).value),card=Number($(cardId).value),amount=Number(total);if(!Number.isFinite(cash)||!Number.isFinite(card)||cash<0||card<0||Math.round((cash+card)*100)!==Math.round(amount*100))throw Error('En pago mixto, efectivo + tarjeta debe ser igual al total.');return {p_efectivo:Number(cash.toFixed(2)),p_tarjeta:Number(card.toFixed(2))}}
$('method').onchange=()=>{$('mixedFields').classList.toggle('active',$('method').value==='Mixto');$('received').style.display=$('method').value==='Mixto'?'none':'block'};$('wmethod').onchange=()=>{$('wmixedFields').classList.toggle('active',$('wmethod').value==='Mixto');$('wreceived').style.display=$('wmethod').value==='Mixto'?'none':'block'};
$('charge').onclick=async()=>{
 if(!selected)return alert('Selecciona una reserva.');
 const method=$('method').value,received=Number($('received').value||selected.precio);
 if(method==='Efectivo'&&received<Number(selected.precio))return alert('El efectivo recibido es insuficiente.');
 try{
  const info={...selected,metodo:method};
  const mixed=mixedPaymentArgs(method,'cashPart','cardPart',selected.precio);
  const isMixed=method==='Mixto';
  const name=isMixed?'barber_admin_create_sale_with_promotion_info_mixed':'barber_admin_create_sale_with_promotion_info';
  const args={p_token:token,p_reserva_id:selected.id,p_metodo:method,p_recibido:received,...(isMixed?mixed:{})};
  const d=await rpc(name,args);
  $('change').textContent='Cambio: $'+Number(d.cambio||0).toFixed(2);
  printTicket({...info,...d,total:Number(d.total??selected.precio),...(isMixed?{efectivo:mixed.p_efectivo,tarjeta:mixed.p_tarjeta}:{})});
  selected=null;$('selected').textContent='Selecciona una reserva.';$('total').textContent='$0.00';
  $('received').value='';$('cashPart').value='';$('cardPart').value='';await load()
 }catch(e){alert(e.message)}
};
function parseClockMinutes(value){
 const m=/^(\\d{2}):(\\d{2})(?::\\d{2})?$/.exec(String(value||''));if(!m)return null;
 const h=Number(m[1]),min=Number(m[2]);return h<=23&&min<=59?h*60+min:null;
}
function localPromotionTime(date){
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Merida',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).map(x=>[x.type,x.value]));
 const days={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
 return {weekday:days[parts.weekday],minutes:Number(parts.hour)*60+Number(parts.minute)};
}
function walkinPromotionPrice(promo,base){
 if(!promo)return {subtotal:base,discount:0,total:base,promo:null};
 let total=base;
 if(promo.discount_type==='percent')total=Math.round(base*(1-Number(promo.discount_value)/100)*100)/100;
 else if(promo.discount_type==='fixed_price')total=Number(promo.discount_value);
 if(!Number.isFinite(total)||total<0||total>base)return {subtotal:base,discount:0,total:base,promo:null};
 return {subtotal:base,discount:Math.round((base-total)*100)/100,total:Math.round(total*100)/100,promo};
}
function selectedWalkinPricing(){
 const option=$('wservice').selectedOptions[0],base=Number(option?.dataset.price||0),promo=walkinPromotions.find(p=>String(p.id)===$('wpromotion').value)||null;
 return walkinPromotionPrice(promo,base);
}
function renderWalkinPromotionSummary(){
 const pricing=selectedWalkinPricing();
 $('wpromoSummary').textContent=pricing.promo?
  pricing.promo.title+': Subtotal $'+pricing.subtotal.toFixed(2)+' · Descuento -$'+pricing.discount.toFixed(2)+' · Total $'+pricing.total.toFixed(2):
  'Subtotal $'+pricing.subtotal.toFixed(2)+' · Sin descuento · Total $'+pricing.total.toFixed(2);
}
async function loadWalkinPromotions(){
 const select=$('wpromotion'),serviceId=String($('wservice').value),current=new Date(),local=localPromotionTime(current);
 select.replaceChildren();
 const none=document.createElement('option');none.value='';none.textContent='Sin promoción';select.append(none);
 walkinPromotions=[];
 try{
  const rows=await rpc('barber_promotions_public',{});
  for(const p of (Array.isArray(rows)?rows:[])){
   if(!(p.service_ids||[]).map(String).includes(serviceId))continue;
   if(current<new Date(p.starts_at)||current>=new Date(p.ends_at))continue;
   if(Array.isArray(p.weekdays)&&p.weekdays.length&&!p.weekdays.map(Number).includes(local.weekday))continue;
   if(p.start_time||p.end_time){
    const start=parseClockMinutes(p.start_time),end=parseClockMinutes(p.end_time);
    if(start==null||end==null||end<=start||local.minutes<start||local.minutes>=end)continue;
   }
   const base=Number($('wservice').selectedOptions[0]?.dataset.price||0),pricing=walkinPromotionPrice(p,base);
   if(pricing.discount<=0)continue;
   walkinPromotions.push(p);
   const option=document.createElement('option');option.value=p.id;
   option.textContent=p.title+' — $'+pricing.total.toFixed(2);select.append(option);
  }
 }catch(error){console.warn('No se pudieron consultar promociones para POS',error)}
 renderWalkinPromotionSummary();
}
async function walkinCharge(){
 const nombre=$('wname').value.trim()||'Cliente mostrador';
 const service=$('wservice').selectedOptions[0],sid=Number($('wservice').value),barberId=Number($('wbarber').value),method=$('wmethod').value;
 const pricing=selectedWalkinPricing(),received=Number($('wreceived').value||pricing.total);
 if(method==='Efectivo'&&received<pricing.total)return alert('El efectivo recibido es insuficiente.');
 try{
  const mixed=mixedPaymentArgs(method,'wcashPart','wcardPart',pricing.total),isMixed=method==='Mixto';
  const sale=await rpc('barber_admin_create_walkin_sale_with_promotion',{
   p_token:token,p_cliente:nombre,p_servicio_id:sid,p_barbero_id:barberId,p_metodo:method,
   p_recibido:received,p_efectivo:isMixed?mixed.p_efectivo:null,p_tarjeta:isMixed?mixed.p_tarjeta:null,
   p_promotion_id:pricing.promo?pricing.promo.id:null
  });
  $('walkinModal').style.display='none';$('wreceived').value='';$('wcashPart').value='';$('wcardPart').value='';
  printTicket({...sale,total:Number(sale.total??pricing.total)});await load()
 }catch(e){alert(e.message)}
}
$('openWalkin').onclick=()=>{$('walkinModal').style.display='grid';loadWalkinPromotions()};$('closeWalkin').onclick=()=>{$('walkinModal').style.display='none'};$('walkCharge').onclick=walkinCharge;$('wservice').addEventListener('change',loadWalkinPromotions);$('wpromotion').addEventListener('change',renderWalkinPromotionSummary);
function openApp(){$('login').style.display='none';$('app').style.display='block';load()}const saved=sessionStorage.getItem('pos_token');if(saved){token=saved;openApp()}setInterval(()=>{if(token)load()},5000);
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(e=>console.warn('PWA SW',e)));}</script>
</body></html>
